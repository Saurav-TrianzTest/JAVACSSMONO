# nginx.conf — cz-css-1012 remediation
# Serves compiled CSS static assets on port 80 and proxies API requests
# to the Spring Boot application running on port 8080.

server {
    listen 80;
    server_name _;

    # Serve compiled CSS assets and other static files from the nginx web root
    root /usr/share/nginx/html;
    index index.html;

    # Static asset serving — compiled CSS, JS, images
    location /assets/ {
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint served directly by nginx for liveness/readiness probes
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Proxy all /api/* requests to the Spring Boot application
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Fallback for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
