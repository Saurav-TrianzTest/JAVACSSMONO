apiVersion: v1
kind: Service
metadata:
  name: dashboard-app-service
  namespace: dashboard-app
  labels:
    app: dashboard-app
    app.kubernetes.io/name: dashboard-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: dashboard-app
