# =============================================================================
# NGINX Configuration — ECS Fargate Runtime CSS Asset URL Rewriting
# Rule: cz-css-1001 (Environment-Specific Asset URLs in CSS)
#
# Strategy: ngx_http_sub_module (sub_filter) rewrites the __ASSET_BASE_URL__
# placeholder token in CSS responses at the proxy layer at runtime.
# The ASSET_BASE_URL environment variable is injected via ECS task definition
# environment variables (or AWS SSM Parameter Store secrets), enabling a single
# container image to be promoted across dev, staging, and production without
# any CSS source modification or sed scripts at startup.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Upstream: Java Spring Boot application (health endpoint + API)
    # ---------------------------------------------------------------------------
    upstream app_backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # -----------------------------------------------------------------------
        # CSS responses: sub_filter rewrites __ASSET_BASE_URL__ placeholder token
        # with the runtime value of the ASSET_BASE_URL environment variable.
        #
        # The NGINX image entrypoint (docker-entrypoint.sh) uses envsubst to
        # substitute ${ASSET_BASE_URL} in this config before NGINX starts,
        # so sub_filter receives the resolved URL string at runtime.
        # -----------------------------------------------------------------------
        location ~* \.css$ {
            # sub_filter replaces the placeholder token with the runtime asset base URL.
            # ASSET_BASE_URL is resolved by envsubst in the entrypoint before NGINX starts.
            sub_filter '__ASSET_BASE_URL__' '${ASSET_BASE_URL}';
            sub_filter_once off;       # Replace ALL occurrences in each CSS response
            sub_filter_types text/css; # Apply only to CSS content-type responses

            # Disable proxy/gzip buffering so sub_filter can process the full body
            gzip off;

            # Serve static CSS files from the html root
            try_files $uri =404;

            # Prevent downstream caches from caching environment-specific responses
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Asset-URL-Rewrite "enabled" always;
        }

        # -----------------------------------------------------------------------
        # Health check endpoint — proxied to Spring Boot /api/health
        # Satisfies ECS Fargate ALB target group health check requirement.
        # -----------------------------------------------------------------------
        location /api/health {
            proxy_pass         http://app_backend/api/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            access_log off;
        }

        # -----------------------------------------------------------------------
        # API proxy — all /api/* requests forwarded to Spring Boot backend
        # -----------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://app_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------------
        # Static assets — served directly from the container filesystem
        # -----------------------------------------------------------------------
        location /assets/ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # -----------------------------------------------------------------------
        # SPA fallback — all other requests serve index.html
        # -----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
