# =============================================================================
# NGINX Configuration — ECS Fargate / Kubernetes Runtime URL Rewriting
# =============================================================================
# Rule: cz-css-1001 — Environment-Specific Asset URLs in CSS
#
# Strategy: ngx_http_sub_module (sub_filter) rewrites the placeholder token
#   __ASSET_BASE_URL__ in CSS responses to the value of the ASSET_BASE_URL
#   environment variable at the proxy layer.
#
# This enables single container-image promotion across dev, staging, and
# production environments without rebuilding the image or running sed scripts
# at container startup.
#
# ECS Fargate task definition must supply:
#   ASSET_BASE_URL  — e.g. https://assets.northwind.io:9000
#                     (stored in AWS SSM Parameter Store / Secrets Manager)
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Runtime environment variable substitution via envsubst at container start.
    # The entrypoint script (docker-entrypoint.sh) calls:
    #   envsubst '$ASSET_BASE_URL' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
    # so that the literal string $ASSET_BASE_URL below is resolved before NGINX starts.
    # ---------------------------------------------------------------------------

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # -----------------------------------------------------------------------
        # CSS responses: rewrite __ASSET_BASE_URL__ placeholder to the runtime
        # value supplied via the ASSET_BASE_URL environment variable.
        #
        # sub_filter is provided by the bundled ngx_http_sub_module (enabled by
        # default in the official nginx Docker image).
        # -----------------------------------------------------------------------
        location ~* \.css$ {
            # Replace every occurrence of the placeholder in CSS responses.
            sub_filter '__ASSET_BASE_URL__' '${ASSET_BASE_URL}';
            sub_filter_once off;          # replace ALL occurrences, not just the first
            sub_filter_types text/css;    # apply only to CSS MIME type

            # Disable proxy/upstream caching so sub_filter always runs on fresh content.
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }

        # -----------------------------------------------------------------------
        # Health check endpoint — required for ECS Fargate / Kubernetes liveness
        # and readiness probes.
        # -----------------------------------------------------------------------
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"UP"}';
        }

        # -----------------------------------------------------------------------
        # Static assets — served directly from the container image.
        # -----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # -----------------------------------------------------------------------
        # Security headers
        # -----------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
